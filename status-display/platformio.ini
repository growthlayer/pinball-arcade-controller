; LilyGO T-Display-S3 (ESP32-S3R8, 16 MB flash, 1.9" ST7789 170x320, 8-bit parallel)
; Build + flash from the repo root:  .venv-esp/bin/pio run -d status-display -t upload
[env:tdisplay-s3]
platform = espressif32@6.9.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
