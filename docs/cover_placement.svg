<text x="96.0" y="920.2" font-size="12.5" text-anchor="start" fill="#555">○ = screw post: ordinary machine screw driven straight in — it forms its own thread in the PLA (hole M3 2.9 · M2.5 2.35 · M2 1.85). Dashed circles = foot recesses.</text>
<text x="96.0" y="940.2" font-size="12.5" text-anchor="start" fill="#555">Large white circles = 6 × M4×10 countersunk, driven from below into the M4 heat-set inserts in the case posts and tabs.</text>
<text x="96.0" y="964.2" font-size="12.5" text-anchor="start" fill="#1f4e79" font-weight="700">SCREW SCHEDULE — cover:  14 × M3×8 (amp 4 · relays 4 + 4 · hub 2)   ·   4 × M2×6 (Pico)   ·   2 × M2.5×8 (LIS3DH) — all machine screws, no nuts</text>
<text x="96.0" y="982.2" font-size="12.5" text-anchor="start" fill="#1f4e79" font-weight="700">4 × M4×10 countersunk (solenoids, into tapped frames)   ·   6 × M4×10 countersunk (cover → case heat-set inserts)</text>
<text x="96.0" y="1004.2" font-size="12.5" text-anchor="start" fill="#555">Not on the cover: exciter (adhesive) and encoder (screws into its own standoffs) go under the case's top panel; joystick is 4 × M4×8 csk from the top.</text></svg>